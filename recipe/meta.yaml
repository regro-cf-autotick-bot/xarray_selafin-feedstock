{% set name = "xarray_selafin" %}
{% set version = "0.2.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ef2e9a354419ac35bbc8a4b903e62243a85805590e104aab390e61f7bcf0251b

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python
  number: 0

requirements:
  host:
    - python >=3.9
    - pip
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning
  run:
    - python >=3.9
    - numpy
    - xarray

test:
  imports:
    - xarray_selafin
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/seareport/xarray-selafin.git
  summary: 'xarray backend for Selafin formats'
  license: Unlicense
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - tomsail
    - pmav99
